plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

def licenseName = "LICENSE_${mod_id}"
tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { licenseName }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    exclusiveContent {
        forRepository { maven { url 'https://www.cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { url 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei' }
    }
    exclusiveContent {
        forRepository { maven { url 'https://maven.terraformersmc.com/' } }
        filter { includeGroup 'dev.emi' }
    }
    exclusiveContent {
        forRepository { maven { url 'https://maven.theillusivec4.top/' } }
        filter { includeGroup 'top.theillusivec4.curios' }
    }
}

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            // Separate from the 1.21.1 branch's run folder so worlds and configs don't mix
            gameDirectory = project.file('run-1.20.1')
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.1.0'
    modImplementation "curse.maven:projecte-226410:${projecte_file_id}"

    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modCompileOnly "dev.emi:emi-forge:${emi_version}:api"

    if (dev_recipe_viewer == 'jei') {
        modLocalRuntime "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    } else if (dev_recipe_viewer == 'emi') {
        modLocalRuntime "dev.emi:emi-forge:${emi_version}"
    }
    modLocalRuntime "top.theillusivec4.curios:curios-forge:${curios_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            projecte_version_range : projecte_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
