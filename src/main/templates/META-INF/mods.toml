modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Litvy9k/ProjectE-transmutation-table-overhaul/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/Litvy9k/ProjectE-transmutation-table-overhaul"
logoFile="transtable_overhaul.png"
credits="ProjectE by sinkillerj and contributors (logo uses ProjectE's Philosopher's Stone texture, MIT). Layout inspired by Applied Energistics 2 terminals."
description='''
Replaces the ProjectE Transmutation Table / Tablet screen with a scrollable, searchable, sortable terminal in the style of Applied Energistics 2.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="projecte"
    mandatory=true
    versionRange="${projecte_version_range}"
    ordering="AFTER"
    side="BOTH"
